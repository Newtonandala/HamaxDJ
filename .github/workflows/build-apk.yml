name: Build HamaxDJ APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into project folders
        run: |
          for f in *__*; do
            dest="${f//__//}"
            mkdir -p "$(dirname "$dest")"
            mv "$f" "$dest"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamaxDJ-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk --title "HamaxDJ latest build" --notes "Debug build of the newest commit. Tap app-debug.apk to install." --prerelease
